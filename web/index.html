<!DOCTYPE html>
<html>
<head>
  <script defer src="startup.js"></script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MDSLens — high-performance MDSplus signal plotting in your browser.">
  <meta name="theme-color" content="#0b1120">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MDSLens">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MDSLens</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #0b1120;
      height: 100%;
      margin: 0;
    }

    #mdslens-startup {
      align-items: center;
      box-sizing: border-box;
      color: #e5e7eb;
      display: flex;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      padding: 24px;
      position: fixed;
      transition: opacity 180ms ease, visibility 180ms ease;
      z-index: 2147483647;
    }

    #mdslens-startup-card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      box-sizing: border-box;
      max-width: 640px;
      padding: 28px;
      width: 100%;
    }

    #mdslens-startup h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }

    #mdslens-startup p {
      color: #cbd5e1;
      line-height: 1.6;
      margin: 8px 0 0;
    }

    #mdslens-startup code {
      background: #020617;
      border-radius: 8px;
      display: block;
      margin-top: 16px;
      overflow-x: auto;
      padding: 12px;
      white-space: pre;
    }

    body.mdslens-ready #mdslens-startup {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div id="mdslens-startup" role="status" aria-live="polite">
    <div id="mdslens-startup-card">
      <h1>MDSLens</h1>
      <p id="mdslens-startup-message">Loading the Web application…</p>
      <code id="mdslens-startup-help" hidden></code>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
