'The update could not be downloaded, verified, or handed to the system installer. No unverified package was opened.' = 'การอัปเดตไม่สามารถดาวน์โหลด ตรวจสอบหรือส่งให้กับตัวติดตั้งระบบได้ การเปิดไฟล์ที่ยังไม่ได้ตรวจสอบแล้ว'
'The update is ready. MDSLens will restart automatically.' = 'การอัปเดตพร้อมแล้ว MDSLens จะเริ่มทำงานใหม่โดยอัตโนมัติ'
