'This item cannot be dropped here' = 'ไม่สามารถวางรายการนี้ได้ที่นี่'
'This removes the entries from the recent list. The configuration files themselves will not be deleted.' = 'จะลบรายการจากรายการล่าสุด ไฟล์ความตั้งค่าจะไม่ถูกลบ'
'This restores the entire application to its initial state. Your saved configuration files will not be deleted.' = 'จะย้อนกลับให้แอพพลิเคชันกลับไปเป็นสถานะเริ่มต้น ไฟล์ความตั้งค่าที่คุณบันทึกจะไม่ถูกลบ'
'This will discard the current waveform layout and panel settings, then restore the built-in default configuration. This action cannot be undone.' = 'การกระทำนี้จะทิ้งเค้าโครงคลื่นและตั้งค่าแผงปัจจุบัน แล้วกู้คืนการตั้งค่าเริ่มต้นที่สร้างไว้ภายใน การกระทำนี้ไม่สามารถยกเลิกได้'
