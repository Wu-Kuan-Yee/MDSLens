[package]
name = "mds-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
mds-core = { path = "../../../mdsscope-rs/mds-core" }
mds-ip = { path = "../../../mdsscope-rs/mds-ip" }
mds-ssh = { path = "../../../mdsscope-rs/mds-ssh" }
mds-auth = { path = "../../../mdsscope-rs/mds-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
