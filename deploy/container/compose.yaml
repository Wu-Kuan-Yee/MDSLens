services:
  mdslens:
    image: ghcr.io/wu-kuan-yee/mdslens-web-gateway:${MDSLENS_IMAGE_TAG:-latest}
    container_name: mdslens-web
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:${MDSLENS_LOCAL_PORT:-18088}:8088"
    environment:
      MDSLENS_WEB_BIND: "0.0.0.0:8088"
      MDSLENS_WEB_ROOT: "/app/web"
      MDSLENS_WEB_SECURE_COOKIE: "1"
      MDSLENS_WEB_ALLOWED_HOSTS: "${MDSLENS_ALLOWED_HOSTS:-202.127.204.12,202.127.204.26,202.127.204.41}"
    networks:
      - mdslens
    stop_grace_period: 10s
    mem_limit: ${MDSLENS_MEMORY_LIMIT:-1g}
    pids_limit: 256

networks:
  mdslens:
    name: mdslens
    driver: bridge
