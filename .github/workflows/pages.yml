name: Deploy product site

on:
  push:
    branches: [main]
    paths:
      - "product-site/**"
      - "scripts/generate_latest_index.py"
      - "scripts/generate_update_manifest.py"
      - "scripts/verify_product_site.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Release packages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify product site
        run: python3 scripts/verify_product_site.py
      - name: Prepare static site
        run: |
          cp -a product-site pages
          touch pages/.nojekyll
      - name: Generate lightweight update index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"
          python3 scripts/generate_latest_index.py \
            --releases-json "$RUNNER_TEMP/releases.json" \
            --output pages/latest.toml
          python3 -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("pages/latest.toml").read_text(encoding="utf-8"))'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
