name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            channel: stable
          - arch: arm64
            runner: windows-11-arm
            channel: main
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.channel }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install Windows packagers
        shell: powershell
        run: choco install 7zip innosetup wixtoolset --no-progress -y
      - name: Build packages
        run: >-
          python build_app.py -p windows -a ${{ matrix.arch }}
          -f exe msi msix zip 7z tar.gz tar.xz tar.bz2
      - name: Verify packaged application icon
        run: >-
          python scripts/verify_icons.py
          --windows-executable
          build/windows/${{ matrix.arch }}/runner/Release/mdslens.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-windows-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error

  windows-msixbundle:
    name: Windows MSIX bundle
    needs: [windows]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mdslens-windows-*
          path: msix-input
          merge-multiple: true
      - name: Build the unsigned multi-architecture bundle
        run: >-
          python scripts/build_msixbundle.py msix-input
          build/dist/mdslens-windows.msixbundle
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-windows-msixbundle
          path: build/dist/mdslens-windows.msixbundle
          if-no-files-found: error

  macos:
    name: macOS arm64, x64, and universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install 7-Zip
        run: brew install sevenzip
      - name: Build packages
        run: >-
          python3 build_app.py -p macos -a universal
          -f app dmg pkg xcarchive zip 7z tar.gz tar.xz tar.bz2
      - name: Verify the application bundle
        run: |
          python3 scripts/verify_icons.py \
            --macos-app build/dist/mdslens-macos-arm64-unsigned.app \
            --macos-app build/dist/mdslens-macos-x64-unsigned.app \
            --macos-app build/dist/mdslens-macos-universal-unsigned.app
          codesign --verify --deep --strict build/dist/mdslens-macos-arm64-unsigned.app
          codesign --verify --deep --strict build/dist/mdslens-macos-x64-unsigned.app
          codesign --verify --deep --strict build/dist/mdslens-macos-universal-unsigned.app
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-macos-all
          path: build/dist/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            channel: stable
          - arch: arm64
            runner: ubuntu-24.04-arm
            channel: main
    steps:
      - name: Install baseline build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang cmake curl git jq libgtk-3-dev \
            libsecret-1-dev ninja-build nasm patchelf p7zip-full perl pkg-config python3 \
            rpm squashfs-tools unzip xz-utils zstd
      - name: Install AppImage tooling
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x64) appimage_arch=x86_64 ;;
            arm64) appimage_arch=aarch64 ;;
          esac
          mkdir -p /opt/appimagetool
          curl -fL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${appimage_arch}.AppImage" \
            -o /opt/appimagetool.AppImage
          chmod +x /opt/appimagetool.AppImage
          cd /opt/appimagetool
          /opt/appimagetool.AppImage --appimage-extract
          ln -s /opt/appimagetool/squashfs-root/AppRun /usr/local/bin/appimagetool
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.channel }}
          cache: true
      - name: Trust the cached Flutter SDK checkout
        run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build packages
        run: >-
          python3 build_app.py -p linux -a ${{ matrix.arch }}
          -f deb rpm pkg.tar.zst pkg.tar.xz AppImage snap
          zip 7z tar.gz tar.xz tar.bz2
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-linux-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error

  linux-flatpak:
    name: Linux Flatpak ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            channel: stable
          - arch: arm64
            runner: ubuntu-24.04-arm
            channel: main
    steps:
      - name: Install build tools and Flatpak runtime
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang cmake flatpak libgtk-3-dev libsecret-1-dev \
            ninja-build nasm patchelf perl pkg-config
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//48 org.gnome.Sdk//48
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.channel }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build Flatpak package
        run: python3 build_app.py -p linux -a ${{ matrix.arch }} -f flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-linux-flatpak-${{ matrix.arch }}
          path: build/dist/*.flatpak
          if-no-files-found: error

  linux-portable-runtime:
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            arch: x64
            image: ubuntu:24.04
            family: debian
            launch: true
          - name: Fedora 44
            runner: ubuntu-24.04
            arch: x64
            image: fedora:44
            family: fedora
            launch: true
          - name: Enterprise Linux 10
            runner: ubuntu-24.04
            arch: x64
            image: rockylinux/rockylinux:10
            family: enterprise
            launch: false
          - name: Enterprise Linux 10 ARM64
            runner: ubuntu-24.04-arm
            arch: arm64
            image: rockylinux/rockylinux:10
            family: enterprise
            launch: false
    name: Portable Linux / ${{ matrix.name }}
    steps:
      - name: Install Ubuntu verifier runtime
        if: matrix.family == 'debian'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils git libegl-mesa0 libegl1 libgl1-mesa-dri \
            libgles2 libgtk-3-0t64 libsecret-1-0 libstdc++6 python3 unzip xvfb
      - name: Install Fedora verifier runtime
        if: matrix.family == 'fedora'
        run: >-
          dnf install -y binutils git gnome-settings-daemon gtk3 libepoxy
          libglvnd-egl libsecret libstdc++ mesa-dri-drivers mesa-libEGL
          python3 unzip
          xorg-x11-server-Xvfb
      - name: Install Enterprise Linux verifier runtime
        if: matrix.family == 'enterprise'
        run: >-
          dnf install -y binutils git gtk3 libepoxy libsecret libstdc++
          python3 unzip
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mdslens-linux-${{ matrix.arch }}
          path: build/dist
      - name: Verify portable dependency closure
        run: >-
          python3 scripts/verify_linux_portable.py
          build/dist/mdslens-linux-${{ matrix.arch }}.zip
          --max-glibc 2.31
      - name: Smoke-launch portable application
        if: matrix.launch
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          python3 scripts/verify_linux_portable.py
          build/dist/mdslens-linux-${{ matrix.arch }}.zip
          --max-glibc 2.31 --launch

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      MDSLENS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MDSLENS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MDSLENS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install the pinned Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"'
      - name: Install pinned bundletool
        run: |
          curl -fL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            -o "$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          echo "BUNDLETOOL_JAR=$RUNNER_TEMP/bundletool-all-1.18.3.jar" >> "$GITHUB_ENV"
      - name: Install the required Android release key
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$MDSLENS_ANDROID_STORE_PASSWORD" ||
                -z "$MDSLENS_ANDROID_KEY_ALIAS" ||
                -z "$MDSLENS_ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Android release signing secrets are required for tag builds."
            exit 1
          fi
          keystore="$RUNNER_TEMP/mdslens-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "MDSLENS_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build APKs and Android App Bundle
        run: python3 build_app.py -p android -f apk aab apks
      - name: Verify the stable Android signing identity
        shell: bash
        run: |
          expected="$(
            tr -d '[:space:]' < android/release-signing-certificate.sha256 |
              tr '[:upper:]' '[:lower:]'
          )"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          verify_apk() {
            local apk="$1"
            "$apksigner" verify --verbose "$apk"
            local actual
            actual="$(
              "$apksigner" verify --print-certs "$apk" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
                tr '[:upper:]' '[:lower:]'
            )"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$apk::Unexpected Android signing certificate: $actual"
              exit 1
            fi
          }
          for apk in build/dist/mdslens-android-*.apk; do
            verify_apk "$apk"
          done
          split_dir="$RUNNER_TEMP/mdslens-release-apks"
          unzip -q build/dist/mdslens-android.apks -d "$split_dir"
          while IFS= read -r -d '' apk; do
            verify_apk "$apk"
          done < <(find "$split_dir" -type f -name '*.apk' -print0)
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-android
          path: build/dist/*
          if-no-files-found: error

  apple-mobile:
    name: iOS and iPadOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install 7-Zip
        run: brew install sevenzip
      - name: Build unsigned Apple mobile packages
        run: >-
          python3 build_app.py -p ios -p ipados
          -f unsigned-ipa unsigned-app xcarchive zip 7z tar.gz tar.xz tar.bz2
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-apple-mobile
          path: build/dist/*
          if-no-files-found: error

  web:
    name: Web Gateway ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            channel: stable
          - arch: arm64
            runner: ubuntu-24.04-arm
            channel: main
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.channel }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install gateway build tools
        run: >-
          sudo apt-get update &&
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y
          build-essential cmake curl nasm perl pkg-config
      - name: Build self-contained Web package
        run: ./scripts/build_web.sh
      - name: Smoke-test Web bundle and session security
        run: >-
          ./scripts/verify_web_bundle.sh
          rust/target/release/mdslens-web-gateway build/web
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture-specific Web Gateway image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: build/web-package/mdslens-web-linux-${{ matrix.arch }}
          file: deploy/container/Dockerfile
          push: true
          build-args: MDSLENS_VERSION=${{ github.ref_name }}
          tags: ghcr.io/wu-kuan-yee/mdslens-web-gateway:${{ github.ref_name }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: mdslens-web-linux-${{ matrix.arch }}
          path: build/dist/mdslens-web-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  web-container:
    name: Publish multi-architecture Web Gateway image
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and latest manifests
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/wu-kuan-yee/mdslens-web-gateway
        shell: bash
        run: |
          latest_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --paginate --jq '.[].ref' |
              sed 's#^refs/tags/##' |
              sort -V |
              tail -n 1
          )"
          manifest_tags=(--tag "${IMAGE}:${GITHUB_REF_NAME}")
          if [[ "$latest_tag" == "$GITHUB_REF_NAME" ]]; then
            manifest_tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${manifest_tags[@]}" \
            "${IMAGE}:${GITHUB_REF_NAME}-x64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, windows-msixbundle, macos, linux, linux-flatpak, linux-portable-runtime, android, apple-mobile, web, web-container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Docker Buildx also publishes internal *.dockerbuild records. They
          # are not release packages and cannot be merged into this directory.
          pattern: mdslens-*
          path: artifacts
          merge-multiple: true
      - name: Generate update manifest
        run: >-
          python3 scripts/generate_update_manifest.py
          --artifacts artifacts
          --version "${GITHUB_REF_NAME}"
          --output artifacts/update-manifest.json
      - name: Generate release checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - name: Upload packages to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          find artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
