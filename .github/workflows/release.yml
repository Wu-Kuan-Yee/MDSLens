name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            channel: stable
          - arch: arm64
            runner: windows-11-arm
            channel: main
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.channel }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install Windows packagers
        shell: powershell
        run: choco install innosetup wixtoolset --no-progress -y
      - name: Build packages
        run: >-
          python build_app.py -p windows -a ${{ matrix.arch }}
          -f exe msi zip tar.gz tar.xz tar.bz2
      - uses: actions/upload-artifact@v4
        with:
          name: mdsscope-windows-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build packages
        run: >-
          python3 build_app.py -p macos
          -f app dmg pkg zip tar.gz tar.xz tar.bz2
      - name: Verify the application bundle
        run: codesign --verify --deep --strict build/dist/mdsscope-macos-universal.app
      - uses: actions/upload-artifact@v4
        with:
          name: mdsscope-macos-universal
          path: build/dist/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            channel: stable
          - arch: arm64
            runner: ubuntu-24.04-arm
            channel: main
    steps:
      - name: Install baseline build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang cmake curl git jq libgtk-3-dev libsecret-1-dev ninja-build \
            nasm perl pkg-config python3 rpm unzip xz-utils zstd
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.channel }}
          cache: true
      - name: Trust the cached Flutter SDK checkout
        run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Build packages
        run: >-
          python3 build_app.py -p linux -a ${{ matrix.arch }}
          -f deb rpm pkg.tar.zst pkg.tar.xz zip tar.gz tar.xz tar.bz2
      - uses: actions/upload-artifact@v4
        with:
          name: mdsscope-linux-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error

  linux-portable-runtime:
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            arch: x64
            image: ubuntu:24.04
          - name: Fedora 44
            runner: ubuntu-24.04
            arch: x64
            image: fedora:44
          - name: Enterprise Linux 10
            runner: ubuntu-24.04
            arch: x64
            image: rockylinux/rockylinux:10
          - name: Enterprise Linux 10 ARM64
            runner: ubuntu-24.04-arm
            arch: arm64
            image: rockylinux/rockylinux:10
    name: Portable Linux / ${{ matrix.name }}
    steps:
      - name: Install verifier runtime
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              binutils git python3 unzip xvfb
          else
            dnf install -y binutils git python3 unzip xorg-x11-server-Xvfb
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mdsscope-linux-${{ matrix.arch }}
          path: build/dist
      - run: >-
          python3 scripts/verify_linux_portable.py
          build/dist/mdsscope-linux-${{ matrix.arch }}.zip
          --max-glibc 2.31 --launch

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      MDSSCOPE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MDSSCOPE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MDSSCOPE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install the pinned Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"'
      - name: Install Android release key when configured
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            keystore="$RUNNER_TEMP/mdsscope-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "MDSSCOPE_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Android signing secrets are absent; APKs will use the local test identity."
          fi
      - name: Build APKs and Android App Bundle
        run: python3 build_app.py -p android -f apk aab
      - uses: actions/upload-artifact@v4
        with:
          name: mdsscope-android
          path: build/dist/*
          if-no-files-found: error

  apple-mobile:
    name: iOS and iPadOS
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Detect signing credentials
        id: signing
        shell: bash
        run: |
          if [[ -n "$APPLE_CERTIFICATE_BASE64" && -n "$APPLE_PROVISIONING_PROFILE_BASE64" && -n "$APPLE_KEYCHAIN_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Apple signing credentials
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/mdsscope-release.p12"
          profile="$RUNNER_TEMP/mdsscope.mobileprovision"
          profile_plist="$RUNNER_TEMP/mdsscope-profile.plist"
          keychain="$RUNNER_TEMP/mdsscope-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
      - name: Build signed IPA
        if: steps.signing.outputs.available == 'true'
        run: python3 build_app.py -p ios -p ipados -f ipa
      - name: Build unsigned verification bundle
        if: steps.signing.outputs.available != 'true'
        run: python3 build_app.py -p ios -p ipados -f unsigned-zip
      - uses: actions/upload-artifact@v4
        with:
          name: mdsscope-apple-mobile
          path: build/dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, linux-portable-runtime, android, apple-mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload packages to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          find artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
