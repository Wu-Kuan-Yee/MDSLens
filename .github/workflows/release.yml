name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Windows Packaging (x64) ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Flutter Windows & Bundle Rust
        run: |
          cargo build --release --manifest-path rust/mds-bridge/Cargo.toml
          flutter build windows --release
          copy rust\target\release\mds_bridge.dll build\windows\x64\runner\Release\

      - name: Create Windows Packages (.zip, .exe)
        shell: powershell
        run: |
          $dist = "build/dist"
          New-Item -ItemType Directory -Force -Path $dist
          
          # 1. Zip Archive
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$dist\mdsscope-windows-x64.zip" -Force

          # 2. Portable EXE
          Copy-Item "build\windows\x64\runner\Release\mdsscope.exe" "$dist\mdsscope-windows-x64-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-packages
          path: build/dist/*

  # ── macOS Packaging (arm64) ─────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Flutter macOS & Bundle Rust
        run: |
          cargo build --release --manifest-path rust/mds-bridge/Cargo.toml
          flutter build macos --release
          APP_PATH="build/macos/Build/Products/Release/mdsscope.app"
          mkdir -p "$APP_PATH/Contents/Frameworks" "$APP_PATH/Contents/MacOS"
          cp rust/target/release/libmds_bridge.dylib "$APP_PATH/Contents/Frameworks/"
          cp rust/target/release/libmds_bridge.dylib "$APP_PATH/Contents/MacOS/"

      - name: Create macOS Packages (.dmg, .pkg, .zip, .tar.gz, .app)
        run: |
          DIST="build/dist"
          mkdir -p "$DIST"
          APP_PATH="build/macos/Build/Products/Release/mdsscope.app"

          # 1. Portable .app Zip/Tar Formats
          cp -R "$APP_PATH" "$DIST/mdsscope-macos-arm64.app"
          (cd build/macos/Build/Products/Release && zip -r "../../../dist/mdsscope-macos-arm64.zip" mdsscope.app)
          (cd build/macos/Build/Products/Release && tar -czf "../../../dist/mdsscope-macos-arm64.tar.gz" mdsscope.app)
          (cd build/macos/Build/Products/Release && tar -cJf "../../../dist/mdsscope-macos-arm64.tar.xz" mdsscope.app)

          # 2. DMG Package
          hdiutil create -volname "MdsScope" -srcfolder "$APP_PATH" -ov -format UDZO "$DIST/mdsscope-macos-arm64.dmg"

          # 3. PKG Installer
          pkgbuild --component "$APP_PATH" --install-location /Applications "$DIST/mdsscope-macos-arm64.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-packages
          path: build/dist/*

  # ── Linux Packaging (deb, pkg.tar.zst, tar.*, zip) ──────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev zstd dpkg-dev

      - name: Build Flutter Linux & Bundle Rust
        run: |
          cargo build --release --manifest-path rust/mds-bridge/Cargo.toml
          flutter build linux --release
          BUNDLE="build/linux/x64/release/bundle"
          mkdir -p "$BUNDLE/lib"
          cp rust/target/release/libmds_bridge.so "$BUNDLE/lib/"
          cp rust/target/release/libmds_bridge.so "$BUNDLE/"

      - name: Create Linux Packages (.tar.gz, .tar.xz, .zip, .pkg.tar.zst, .deb)
        run: |
          DIST="build/dist"
          mkdir -p "$DIST"
          BUNDLE="build/linux/x64/release/bundle"

          # Archives
          (cd "$BUNDLE" && tar -czf "../../../../$DIST/mdsscope-linux-x64.tar.gz" *)
          (cd "$BUNDLE" && tar -cJf "../../../../$DIST/mdsscope-linux-x64.tar.xz" *)
          (cd "$BUNDLE" && zip -r "../../../../$DIST/mdsscope-linux-x64.zip" *)

          # Arch Linux .pkg.tar.zst
          (cd "$BUNDLE" && tar -c --zstd -f "../../../../$DIST/mdsscope-linux-x64.pkg.tar.zst" *)

          # Debian .deb Package
          DEB_DIR="build/deb/mdsscope-linux-x64"
          mkdir -p "$DEB_DIR/usr/bin" "$DEB_DIR/usr/lib/mdsscope" "$DEB_DIR/DEBIAN"
          cp -R "$BUNDLE/"* "$DEB_DIR/usr/lib/mdsscope/"
          ln -sf /usr/lib/mdsscope/mdsscope "$DEB_DIR/usr/bin/mdsscope"
          cat <<EOF > "$DEB_DIR/DEBIAN/control"
Package: mdsscope
Version: 7.0.0
Architecture: amd64
Maintainer: MdsScope Contributors
Description: Signal data plotting for MDSplus experiments
EOF
          chmod 755 "$DEB_DIR/DEBIAN" "$DEB_DIR/DEBIAN/control"
          dpkg-deb --build "$DEB_DIR" "$DIST/mdsscope-linux-x64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-packages
          path: build/dist/*
