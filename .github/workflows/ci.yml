name: CI

on:
  push:
    branches: [master, main, flutter-rewrite]
  pull_request:
    branches: [master, main, flutter-rewrite]

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 -m py_compile build_app.py
      - run: python3 build_app.py --help
      - run: python3 -m unittest scripts/test_build_app.py
      - run: python3 scripts/verify_icons.py
      - run: flutter analyze
      - run: flutter test

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

  desktop-build:
    needs: [flutter, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: x64
            python: python3
            channel: stable
            artifact: linux-x64
            bundle: build/dist/mdsscope-linux-x64.zip
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
            python: python3
            channel: main
            artifact: linux-arm64
            bundle: build/dist/mdsscope-linux-arm64.zip
          - os: macos-15
            target: macos
            arch: auto
            python: python3
            channel: stable
            artifact: macos-universal
            bundle: build/dist/mdsscope-macos-universal.zip
          - os: windows-2025
            target: windows
            arch: x64
            python: python
            channel: stable
            artifact: windows-x64
            bundle: build/dist/mdsscope-windows-x64.zip
          - os: windows-11-arm
            target: windows
            arch: arm64
            python: python
            channel: main
            artifact: windows-arm64
            bundle: build/dist/mdsscope-windows-arm64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Flutter does not publish every stable SDK archive for ARM64 hosts.
          # The action's main-channel mode clones upstream and checks out this
          # exact version tag, which is Flutter's documented ARM64 fallback.
          channel: ${{ matrix.channel }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build pkg-config
      - run: >-
          ${{ matrix.python }} build_app.py -p ${{ matrix.target }}
          -a ${{ matrix.arch }} -f zip
      - uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  android-build:
    needs: [flutter, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"'
      - run: python3 build_app.py -p android -f apk
      - uses: actions/upload-artifact@v4
        with:
          name: ci-android
          path: build/dist/*.apk
          if-no-files-found: error

  apple-mobile-build:
    needs: [flutter, rust]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: python3 build_app.py -p ios -p ipados -f unsigned-zip
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apple-mobile
          path: build/dist/*-unsigned.zip
          if-no-files-found: error
