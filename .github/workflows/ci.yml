name: CI

on:
  push:
    branches: [master, main, flutter-rewrite]
  pull_request:
    branches: [master, main, flutter-rewrite]

env:
  FLUTTER_VERSION: 3.44.3

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

  desktop-build:
    needs: [flutter, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            bundle: build/linux/x64/release/bundle
          - os: macos-15
            target: macos
            bundle: build/macos/Build/Products/Release/MdsScope.app
          - os: windows-2025
            target: windows
            bundle: build/windows/x64/runner/Release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build pkg-config
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.target }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
