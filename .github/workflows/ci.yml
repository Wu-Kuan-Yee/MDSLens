name: CI

on:
  push:
    branches: [master, main, flutter-rewrite]
  pull_request:
    branches: [master, main, flutter-rewrite]

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 scripts/verify_icons.py
      - run: flutter analyze
      - run: flutter test

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

  desktop-build:
    needs: [flutter, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            channel: stable
            artifact: linux-x64
            bundle: build/linux/x64/release/bundle
          - os: ubuntu-24.04-arm
            target: linux
            channel: main
            artifact: linux-arm64
            bundle: build/linux/arm64/release/bundle
          - os: macos-15
            target: macos
            channel: stable
            artifact: macos-universal
            bundle: build/macos/Build/Products/Release/MdsScope.app
          - os: windows-2025
            target: windows
            channel: stable
            artifact: windows-x64
            bundle: build/windows/x64/runner/Release
          - os: windows-11-arm
            target: windows
            channel: main
            artifact: windows-arm64
            bundle: build/windows/arm64/runner/Release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Flutter does not publish every stable SDK archive for ARM64 hosts.
          # The action's main-channel mode clones upstream and checks out this
          # exact version tag, which is Flutter's documented ARM64 fallback.
          channel: ${{ matrix.channel }}
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build pkg-config
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  android-build:
    needs: [flutter, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"'
      - run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ci-android
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  apple-mobile-build:
    needs: [flutter, rust]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apple-mobile
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
