name: mdsscope
description: MDSplus signal plotting for EAST fusion research.
publish_to: 'none'
version: 7.0.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  ffi: ^2.0.0
  fl_chart: ^0.70.0
  provider: ^6.1.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/source_index/trees.txt
    - assets/source_index/signals/
