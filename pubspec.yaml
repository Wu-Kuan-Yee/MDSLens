name: mdslens
description: MDSplus signal plotting for EAST fusion research.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.0.0
  fl_chart: ^0.70.0
  provider: ^6.1.0
  file_picker: ^8.0.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  desktop_drop: ^0.7.1
  http: ^1.5.0
  crypto: ^3.0.7
  toml: ^0.18.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: MDSLens Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
  assets:
    - assets/app_icon.png
    - assets/languages/
    - assets/source_index/trees.txt
    - assets/source_index/signals/
